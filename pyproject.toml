[project]
name = "claudemail"
version = "0.1.0"
description = "iOS Mail inspired web UI for controlling Claude Code"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "ruff>=0.14.13",
    "ty>=0.0.13",
]
